name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build KeyboardTaskRunner.sln -c Release

      - name: Test
        run: dotnet test tests/KeyboardTaskRunner.Tests/KeyboardTaskRunner.Tests.csproj -c Release --no-build
