name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/KeyboardTaskRunner.Tests/KeyboardTaskRunner.Tests.csproj -c Release

      # publish the app project explicitly so the test project is not published too;
      # trimming settings come from KeyboardTaskRunner.csproj
      - name: Publish
        run: dotnet publish KeyboardTaskRunner.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net10.0-windows/win-x64/publish/KeyboardTaskRunner.exe
          generate_release_notes: true
